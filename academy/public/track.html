<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Track — ZimLink Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/style.css"/>
<style>
  .track-layout{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-top:16px;align-items:start}
  /* ===== Track detail mobile layout — stack to bounds ===== */
  @media (max-width:720px){
    .track-hero{padding:14px !important}
    .track-hero h1{font-size:24px !important}
    .track-layout{grid-template-columns:1fr;grid-template-areas:"main" "side";gap:14px;margin-top:12px}
    .track-layout .track-main{grid-area:main;min-width:0}
    .track-layout .track-side{grid-area:side;min-width:0}
    .track-side .card{position:static !important}
    .track-course{padding:10px !important;gap:10px !important}
    .track-course .btn{padding:7px 10px !important;font-size:12px !important}
  }
</style>
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <button class="hamburger" id="hamburger">☰</button>
    <a class="logo" href="/"><span class="logo-mark" style="background:transparent;border:none;box-shadow:none;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8 L12 3.5 L21 8 L12 12.5 Z" stroke="white" stroke-width="1.7" stroke-linejoin="round" fill="none"/><path d="M5 10.2 V14.8 C5 14.8 8.5 17.8 12 17.8 C15.5 17.8 19 14.8 19 14.8 V10.2" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 12.5 V18.2" stroke="white" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="20.2" r="1.4" fill="white"/></svg></span> <span style="font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-.02em;color:white">ZimLink</span> <span style="font-family:'Poppins',sans-serif;font-weight:400;letter-spacing:-.02em;color:white">Academy</span></a>
    <div class="nav-links">
      <a href="/catalog.html">Catalog</a>
      <a href="/tracks.html" class="active">Tracks</a>
      <a href="/exams.html">Certification</a>
      <a href="/dashboard.html">Learn</a>
    </div>
    <div class="nav-actions"><a href="/dashboard.html" class="btn btn-sm" style="background:var(--dc-green);color:var(--dc-navy)">Learn</a></div>
  </div>
</nav>

<div class="mobile-backdrop" id="mobileBackdrop"></div>
<nav class="mobile-drawer" id="mobileDrawer">
  <div style="padding:12px 16px;border-bottom:1px solid #0a2540;display:flex;align-items:center;gap:10px">
    <span style="width:28px;height:28px;border-radius:8px;background:var(--dc-green);display:grid;place-items:center;color:#05192d;font-weight:900">ZL</span>
    <span style="font-weight:800;color:white">ZimLink</span> <span style="color:#8aa0c2">Academy</span>
    <button id="drawerClose" style="margin-left:auto;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:white;display:grid;place-items:center"><i class="bi bi-x-lg"></i></button>
  </div>
  <a href="/"><i class="bi bi-house-door"></i> Home</a>
  <a href="/catalog.html"><i class="bi bi-collection"></i> Catalog</a>
  <a href="/tracks.html"><i class="bi bi-signpost-split"></i> Tracks</a>
  <a href="/exams.html"><i class="bi bi-patch-check"></i> Certification</a>
  <a href="/dashboard.html"><i class="bi bi-mortarboard"></i> Learn</a>
  <div style="margin-top:auto;padding:16px;border-top:1px solid #0a2540">
    <a href="/catalog.html" class="btn" style="width:100%;justify-content:center;background:var(--dc-green);color:#05192d">Get Started</a>
  </div>
</nav>
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/"><i class="bi bi-house-door"></i><span>Home</span></a>
    <a href="/catalog.html"><i class="bi bi-collection"></i><span>Catalog</span></a>
    <a href="/tracks.html"><i class="bi bi-signpost-split"></i><span>Tracks</span></a>
    <a href="/dashboard.html"><i class="bi bi-person"></i><span>Learn</span></a>
  </div>
</nav>
<script>
(function(){
  const btn=document.getElementById('hamburger');
  const drawer=document.getElementById('mobileDrawer');
  const backdrop=document.getElementById('mobileBackdrop');
  const closeBtn=document.getElementById('drawerClose');
  function open(){drawer&&drawer.classList.add('open');backdrop&&backdrop.classList.add('open');document.body.style.overflow='hidden';}
  function close(){drawer&&drawer.classList.remove('open');backdrop&&backdrop.classList.remove('open');document.body.style.overflow='';}
  btn&&btn.addEventListener('click',open);
  closeBtn&&closeBtn.addEventListener('click',close);
  backdrop&&backdrop.addEventListener('click',close);
  // highlight active
  const path=location.pathname;
  document.querySelectorAll('.mobile-drawer a, .bottom-nav a').forEach(a=>{
    if(a.getAttribute('href')===path || (path==='/' && a.getAttribute('href')==='/')) a.classList.add('active');
  });
})();
</script>


<div id="hero" style="background:var(--dc-navy);border-bottom:1px solid #0a2540;color:white">
  <div class="container track-hero" style="padding:16px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <div id="icon" style="width:48px;height:48px;border-radius:6px;display:grid;place-items:center;font-size:22px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);flex-shrink:0"></div>
    <div style="flex:1;min-width:260px"><div id="meta" style="font-size:11px;color:#8aa0c2;font-weight:700;letter-spacing:.04em;text-transform:uppercase"></div><h1 id="title" style="font-size:20px;letter-spacing:-.02em;margin-top:2px;color:white"></h1><p id="desc" style="font-size:12.5px;color:#8aa0c2;margin-top:4px;max-width:640px"></p></div>
    <div style="text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end"><div class="badge" style="background:var(--dc-green-soft);color:var(--dc-green);border-color:var(--dc-green-border)" id="cert"></div><div style="font-size:11px;color:#8aa0c2" id="jobs"></div></div>
  </div>
</div>

<div class="container track-layout">
  <main class="track-main">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><h2 style="font-size:14px;font-weight:800">Courses in this track</h2><span id="count" class="badge badge-neutral"></span></div>
    <div id="courses" style="display:grid;gap:10px"></div>
  </main>
  <aside class="track-side">
    <div class="card" style="position:sticky;top:80px;padding:0;overflow:hidden">
      <div style="padding:14px;border-bottom:1px solid var(--dc-border)"><h3 style="font-size:13px;font-weight:800">Track progress</h3><div class="progress" style="margin-top:10px"><i id="prog" style="width:0%;background:var(--dc-green)"></i></div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dc-muted);margin-top:8px"><span id="prog-text">0% • 0/0</span><span id="prog-xp">0 XP</span></div></div>
      <div style="padding:14px">
        <div style="font-size:12.5px;color:var(--dc-muted)">Complete all to earn <b style="color:var(--dc-text)" id="cert2"></b>.</div>
        <a href="/dashboard.html" class="btn" style="width:100%;justify-content:center;margin-top:12px;background:var(--dc-green);color:var(--dc-navy)">Go to Learn</a>
      </div>
    </div>
  </aside>
</div>

<script type="module">
import { fetchJSON, getUserId, renderIcon, getTechIcon } from '/js/app.js';
const slug = new URLSearchParams(location.search).get('slug') || 'ai-engineer';
const track = await fetchJSON('/api/tracks/'+slug);
document.title = track.title + ' — ZimLink Academy';
const logoMap = {
  "ai-engineer": "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tensorflow/tensorflow-original.svg",
  "generative-ai-developer": "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/openai.svg",
  "data-scientist-ai": "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg"
};
const logoUrl = logoMap[track.slug] || logoMap[track.id];
const iconEl = document.getElementById('icon');
if(logoUrl){
  iconEl.style.background='white';
  iconEl.style.border='1px solid #e2e8f0';
  iconEl.style.boxShadow='0 2px 8px rgba(0,0,0,.08)';
  iconEl.innerHTML = `<img src="${logoUrl}" alt="${track.title}" style="width:32px;height:32px;object-fit:contain;display:block;filter:none"/>`;
} else {
  iconEl.innerHTML = renderIcon(track.icon);
}
document.getElementById('title').textContent = track.title;
document.getElementById('desc').textContent = track.description;
document.getElementById('meta').textContent = track.level + ' • ' + track.duration + ' • ' + track.projects + ' projects';
document.getElementById('cert').textContent = track.certificate;
document.getElementById('cert2').textContent = track.certificate;
document.getElementById('jobs').textContent = track.jobs;
document.getElementById('count').textContent = track.courses.length + ' courses';
document.getElementById('courses').innerHTML = track.courseDetails.map((c,i)=>{
  const ic = getTechIcon(c);
  return `
  <a href="/course.html?slug=${c.slug}" class="card track-course" style="flex-direction:row;align-items:center;padding:12px;gap:12px">
    <div class="track-num" style="width:32px;height:32px;border-radius:999px;background:var(--dc-bg);border:1px solid var(--dc-border);display:grid;place-items:center;font-weight:800;color:var(--dc-muted);font-size:12px">${i+1}</div>
    <div style="width:36px;height:36px;border-radius:10px;background:white;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:6px;flex-shrink:0">${ic}</div>
    <div style="flex:1;min-width:0"><b style="font-size:13px">${c.title}</b><div style="font-size:11px;color:var(--dc-muted)">${c.level} • ${c.duration} • ${c.xp} XP</div></div>
    <span class="btn btn-sm" style="background:var(--dc-green);color:var(--dc-navy)">Start <i class="bi bi-arrow-right-circle-fill"></i></span>
  </a>
`;}).join('');
try{
  const prog = await fetchJSON('/api/progress?userId='+getUserId());
  const done = track.courses.filter(cid=>{ const d=prog.completed?.[cid]||[]; const c=track.courseDetails.find(x=>x.id===cid); if(!c) return false; const t=c.chapters.reduce((a,ch)=>a+ch.lessons.length,0); return d.length>=t; }).length;
  const pct=Math.round(done/track.courses.length*100);
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-text').textContent=pct+'% • '+done+'/'+track.courses.length+' courses';
  document.getElementById('prog-xp').textContent=(prog.xp||0).toLocaleString()+' XP';
}catch{}
</script>
</body>
</html>
